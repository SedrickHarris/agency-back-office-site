&lt;div style=&quot;display:flex;align-items:center;gap:16px&quot;&gt;&lt;span class=&quot;back&quot;&gt;Back&lt;/span&gt;&lt;div class=&quot;btn&quot;&gt;Send message&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Fields re-validate on blur and clear as soon as they are valid. If an error is traced to an earlier step (for example the Function rejects the message), the survey returns to that step and shows its summary.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 4 Sending --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;04 / Sending&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;Valid submit while the request is in flight.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;label&gt;Full name &lt;span class=&quot;req&quot;&gt;(required)&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;Jordan Lee&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;label&gt;Phone number &lt;span class=&quot;req&quot;&gt;(required)&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;(555) 010-0123&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;label&gt;Email address &lt;span class=&quot;req&quot;&gt;(required)&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;jordan@example.com&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;btn busy&quot; aria-disabled=&quot;true&quot;&gt;Sending...&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Button is set aria-disabled and keeps focus. Back is hidden while sending. A visually hidden status line announces &quot;Sending your message&quot;. Request times out after 15 seconds.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 5 Verification error --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;05 / Security check not finished&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;Turnstile token missing, expired or rejected.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;p style=&quot;font:600 15px &#x27;Inter&#x27;,sans-serif&quot;&gt;Security check&lt;/p&gt;&lt;div class=&quot;wdg&quot;&gt;Turnstile widget renders here (300 x 65)&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;notice&quot; role=&quot;alert&quot;&gt;&lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.75&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 7.5v5.5M12 16.5v.01&quot;/&gt;&lt;/svg&gt;&lt;p&gt;The security check did not finish. Wait for it to complete, then send again.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;align-items:center;gap:16px&quot;&gt;&lt;span class=&quot;back&quot;&gt;Back&lt;/span&gt;&lt;div class=&quot;btn&quot;&gt;Send message&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The widget is reset. Focus moves to the notice. Every answer from all three steps is kept.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 6 Network error --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;06 / Network error&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;Request fails or times out.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;label&gt;Email address &lt;span class=&quot;req&quot;&gt;(required)&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;jordan@example.com&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;notice&quot; role=&quot;alert&quot;&gt;&lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.75&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 7.5v5.5M12 16.5v.01&quot;/&gt;&lt;/svg&gt;&lt;p&gt;Your message did not send. Check your connection and try again. What you wrote is still here.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;align-items:center;gap:16px&quot;&gt;&lt;span class=&quot;back&quot;&gt;Back&lt;/span&gt;&lt;div class=&quot;btn&quot;&gt;Send message&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Same button, same position, so a retry is one click. No mailto fallback because no public email address exists.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 7 Server error --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;07 / Server error&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;The Function returns a server error.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;fld&quot;&gt;&lt;label&gt;Email address &lt;span class=&quot;req&quot;&gt;(required)&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;jordan@example.com&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;notice&quot; role=&quot;alert&quot;&gt;&lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.75&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 7.5v5.5M12 16.5v.01&quot;/&gt;&lt;/svg&gt;&lt;p&gt;Something went wrong and your message did not send. Try again in a few minutes. What you wrote is still here.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;align-items:center;gap:16px&quot;&gt;&lt;span class=&quot;back&quot;&gt;Back&lt;/span&gt;&lt;div class=&quot;btn&quot;&gt;Send message&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;No stack traces or provider messages are ever shown. The Function logs no message text, phone number or email address.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 8 Success --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;08 / Success&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;The Function returns ok. The survey is replaced.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;status&quot; style=&quot;gap:14px&quot;&gt;
&lt;div style=&quot;display:flex;gap:12px;align-items:center;color:#04153A&quot;&gt;&lt;svg width=&quot;28&quot; height=&quot;28&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.75&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M8 12.5l2.7 2.7L16 9.5&quot;/&gt;&lt;/svg&gt;&lt;h2 class=&quot;hd&quot; style=&quot;font-weight:700;font-size:26px;letter-spacing:-.01em&quot;&gt;Message sent&lt;/h2&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:16px;line-height:1.6&quot;&gt;Thanks, Jordan. Your message has been sent.&lt;/p&gt;
&lt;p style=&quot;font-size:16px;line-height:1.6;color:#425068&quot;&gt;In the meantime, you can &lt;a href=&quot;FormStates.dc.html&quot;&gt;browse training topics&lt;/a&gt; or &lt;a href=&quot;FormStates.dc.html&quot;&gt;see how to get started&lt;/a&gt;.&lt;/p&gt;
&lt;p style=&quot;margin-top:4px&quot;&gt;&lt;a href=&quot;FormStates.dc.html&quot; style=&quot;font-weight:600;font-size:16px&quot;&gt;Send another message&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Focus moves to the &quot;Message sent&quot; heading. &quot;Send another message&quot; restores step 1 with all answers cleared and a fresh security check.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 9 JavaScript off --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;09 / JavaScript off&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;Scripts disabled or blocked.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h2 class=&quot;hd&quot; style=&quot;font-weight:700;font-size:24px;letter-spacing:-.01em&quot;&gt;Send a message&lt;/h2&gt;
&lt;div class=&quot;notice&quot;&gt;&lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.75&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 7.5v5.5M12 16.5v.01&quot;/&gt;&lt;/svg&gt;&lt;p&gt;This form needs JavaScript to send your message. Turn JavaScript on, or try a different browser.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Static text inside a noscript element. The steps are not rendered without scripts. The rest of the page still reads and links normally.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- 10 Rules --&gt;
&lt;div class=&quot;tile&quot;&gt;
&lt;div class=&quot;tile-h&quot;&gt;&lt;p class=&quot;label&quot;&gt;10 / How states are built&lt;/p&gt;&lt;p style=&quot;margin-top:6px;font-size:15px;color:#425068&quot;&gt;Rules the build follows in every state.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;border:1px solid #D2DAE8;border-top:2px solid #04153A;padding:24px;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.5&quot;&gt;
&lt;div style=&quot;display:flex;gap:12px&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;p&gt;&lt;strong style=&quot;font-weight:600&quot;&gt;Not color alone.&lt;/strong&gt; Icon, text and a 2px top rule carry every error. Error color #B3261E is about 6.5:1 on white. Selected pills add a check and a dark fill.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:12px&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;p&gt;&lt;strong style=&quot;font-weight:600&quot;&gt;One place to look.&lt;/strong&gt; Field messages sit under the field or pill group. Form-level notices sit directly above the buttons.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:12px&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;p&gt;&lt;strong style=&quot;font-weight:600&quot;&gt;Announced.&lt;/strong&gt; Summaries and notices use role=alert. Success uses role=status. Step changes move focus to the new question.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:12px&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;p&gt;&lt;strong style=&quot;font-weight:600&quot;&gt;No lost work.&lt;/strong&gt; Back and every error keep what the visitor chose and typed.&lt;/p&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:12px&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;p&gt;&lt;strong style=&quot;font-weight:600&quot;&gt;No promises.&lt;/strong&gt; No state mentions how soon a reply or call will come.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;/div&gt;
&lt;/div&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></body></html>
